# Reforge MCP Configuration
#
# Every key here is read by the code. Options that were documented but never
# wired up have been removed rather than left to imply behaviour that does not
# exist - most dangerously a dry_run that promised no files would be modified.

[scan]
# Extra directory names to skip, on top of the built-in list (node_modules,
# .git, __pycache__, venv, dist, build, .next, target and similar).
ignore = ["node_modules", ".git", "dist", "venv", "__pycache__"]

[fix]
# Number of commits before git_commit pauses and asks for confirmation. It
# returns needs_confirmation, and the caller re-sends with confirmed=true.
confirm_every = 5

# Maximum commits in one session, counted per repository for the life of the
# server process. Restarting the server starts a new session.
session_budget = 20
