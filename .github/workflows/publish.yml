name: Publish

# Publishes to PyPI when a GitHub release is published. Authentication is PyPI
# Trusted Publishing: the job exchanges a GitHub OIDC token for a short-lived
# PyPI credential, so no API token is stored anywhere.
#
# One-time setup, on pypi.org -> reforge-mcp -> Publishing -> add a publisher:
#   owner: Codewithaiyan   repository: reforge-mcp
#   workflow: publish.yml  environment: pypi
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Refuse to publish a version the tag does not match
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$version"
          test "$tag" = "$version"

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required to mint the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
