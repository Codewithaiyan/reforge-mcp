name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows earns a column: this tool resolves paths, rewrites files and
        # shells out, which is where separator and line-ending bugs live. macOS
        # would behave like ubuntu here, so it buys runtime rather than cover.
        os: [ubuntu-latest, windows-latest]
        # The supported floor, release-build interpreter, and newest release.
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests

      - name: Run tests
        run: pytest -v --tb=short
